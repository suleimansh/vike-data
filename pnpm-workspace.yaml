packages:
  - examples/*
  - fixtures/*
  - packages/*

# pnpm 11 requires build scripts to be explicitly approved via `allowBuilds`;
# `onlyBuiltDependencies` alone now fails a fresh/frozen install with
# ERR_PNPM_IGNORED_BUILDS (e.g. on a clean clone or in CI).
allowBuilds:
  esbuild: true
  better-sqlite3: true
  # Next.js (bench-app-next) pulls the optional, prebuilt `sharp`; its build script
  # is not needed, so decline it to keep a fresh/frozen install from failing.
  sharp: false
  # Optional GemStack provider SDKs (gemini); @gemstack/ai-sdk lazy-loads them via
  # dynamic import inside provider methods, so their build scripts are not needed.
  '@google/genai': false
  protobufjs: false

onlyBuiltDependencies:
  - esbuild
  - better-sqlite3

verifyDepsBeforeRun: false

# Pin Vike to the commit build that contains config.pages (vike#3356, merged
# 2026-06-21; merge commit f6ecfb2), so extensions can define pages programmatically
# (vike-auth/react ships /login + /account). Drop back to a stable ^0.4 release once
# one publishes with #3356.
overrides:
  vike: 0.4.259-commit-f6ecfb2
  # Pin ONE React across the whole workspace (deps, peers, transitive). The UI packages
  # (vike-themes/-layouts/-toolbar/-blocks) declare react as a `>=18` peer, so with a mix of
  # react 18 + 19 example apps pnpm kept a react@18.3.1 copy; vite's `resolve.dedupe` then bound
  # to it while an app's react-dom was 19, crashing SSR with a null hooks dispatcher
  # (`Cannot read properties of null (reading 'useContext')`). Forcing react 19 everywhere
  # collapses it to a single copy. Bump both together.
  react: ^19.2.0
  react-dom: ^19.2.0

minimumReleaseAgeExclude:
  - vike@0.4.259-commit-f6ecfb2
  # GemStack and Rudder packages are first-party (we publish them); never hold their
  # fresh releases behind a release-age cooldown. The Rudder wildcard lets the rudder
  # adapter track a just-published @rudderjs/database without re-pinning each release.
  - '@gemstack/*'
  - '@rudderjs/*'
  - '@brillout/docpress@0.16.46'
  - '@brillout/docpress@0.16.49'
